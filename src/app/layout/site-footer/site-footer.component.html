<footer class="site-footer">
  <div class="wrap contact">
    <div class="contact-body">
      <a class="email" [href]="'mailto:' + profile.email">
        {{ profile.email }}
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8" /></svg>
      </a>
      <ul class="contact-links">
        <li><a [href]="profile.resume" target="_blank" rel="noopener">Résumé</a></li>
        <li><a [href]="profile.linkedin" target="_blank" rel="noopener">LinkedIn</a></li>
        <li><a [href]="profile.github" target="_blank" rel="noopener">GitHub</a></li>
        <li><a [href]="profile.itch" target="_blank" rel="noopener">itch.io</a></li>
      </ul>
    </div>
  </div>
  <div class="wrap foot-bar">
    <span>© {{ year }} {{ profile.name }}</span>
    <span>{{ profile.campus }}</span>
  </div>
</footer>
