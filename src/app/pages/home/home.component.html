<!-- Hero -->
<section class="wrap hero">
  <div class="hero-text">
    <p class="label reveal">{{ profile.degree }} · {{ profile.school }}</p>
    <h1 class="display reveal" style="--i: 1">Vijay Ravi</h1>
    <p class="hero-lede reveal" style="--i: 2">
      I build
      <ng-container *ngFor="let d of disciplines; let last = last">
        <ng-container *ngIf="last">and </ng-container>
        <a class="phrase" [routerLink]="'/' + d.id" [attr.data-d]="d.id"
           (mouseenter)="highlight = d.id" (mouseleave)="highlight = null"
           (focus)="highlight = d.id" (blur)="highlight = null"><app-glyph [d]="d.id" [size]="14"></app-glyph><span class="phrase-word">{{ phraseHead(d) }}</span> {{ phraseTail(d) }}</a>{{ last ? '.' : ',' }}
      </ng-container>
    </p>
    <div class="hero-cta reveal" style="--i: 3">
      <a class="btn" [href]="profile.resume" target="_blank" rel="noopener">
        Résumé
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 4v13M6 11l6 6 6-6M5 20h14" /></svg>
      </a>
      <a class="btn ghost" [href]="'mailto:' + profile.email">Email me</a>
    </div>
  </div>

  <figure class="hero-map reveal" style="--i: 2">
    <app-triad-map [items]="work" [highlight]="highlight"></app-triad-map>
    <figcaption class="label">Every project, placed by discipline</figcaption>
  </figure>
</section>

<!-- Proof points -->
<section class="wrap">
  <div class="stats reveal" style="--i: 4">
    <div class="stat" *ngFor="let s of stats">
      <span class="stat-value">{{ s.value }}</span>
      <span class="stat-label">{{ s.label }}</span>
    </div>
  </div>
</section>

<!-- Disciplines -->
<section class="wrap section">
  <header class="section-head"><h2>Disciplines</h2></header>
  <ol class="index">
    <li *ngFor="let d of disciplines" [attr.data-d]="d.id">
      <a class="index-row" [routerLink]="'/' + d.id"
         (mouseenter)="highlight = d.id" (mouseleave)="highlight = null">
        <span class="index-num">{{ d.index }}</span>
        <app-glyph [d]="d.id" [size]="24"></app-glyph>
        <span class="index-name">{{ d.name }}</span>
        <span class="index-desc">{{ d.lede }}</span>
        <span class="index-arrow" aria-hidden="true">→</span>
      </a>
    </li>
  </ol>
</section>

<!-- Selected work -->
<section class="wrap section">
  <header class="section-head"><h2>Selected work</h2></header>
  <div class="grid">
    <app-work-card *ngFor="let w of featured" [work]="w"></app-work-card>
  </div>
</section>
